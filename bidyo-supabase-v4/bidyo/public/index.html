<!doctype html>
<html lang="en">
<head>

  <title>Bidyo — Upload. Share. Have fun!</title>
  <meta name="description" content="Watch videos free, no account needed. Make a free account (username, password, no email codes) only when you want to upload.">
  <meta name="theme-color" content="#1B1340">
  <link rel="icon" type="image/svg+xml" href="/img/logo.svg">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<body>
  <div id="app"></div>
  <div id="toasts" role="status" aria-live="polite"></div>

  <aside id="adslot" class="adslot" aria-label="Advertisement">
    <p class="ad-label">Sponsored</p>
    <div id="container-761dd12a7a34e4b4f89e85f468ba8450"></div>
    <a class="ad-link" href="https://asiaso.org/4/bc42f359314abf75704c067d73937707" target="_blank" rel="sponsored noopener">Sponsored link</a>
  </aside>
  <noscript><p style="padding:24px;font-family:sans-serif">Bidyo needs JavaScript to run.</p></noscript>
  <!-- defer = the page paints first, scripts run in order right after -->
  <script defer src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
  <script defer src="/config.js"></script>
  <script defer src="/js/app.js"></script>
  <!-- Ad network scripts (async so they never block the page) -->
  <script async="async" data-cfasync="false" src="https://brijmohan.org/21/761dd12a7a34e4b4f89e85f468ba8450"></script>

</body>
</html>
